name: app-devcontainer

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  workspace:
    image: app-workspace:${DEVCONTAINER_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-latest}
    # The host user owns every file the container writes; scripts/dc exports HOST_UID and HOST_GID.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    # The marker lets scripts/dc manage this stack and no other devcontainer project's stack.
    labels:
      dc.managed: "true"
    shm_size: 1gb
    # Ten browser test workers peak at about 6 GiB.
    mem_limit: ${DEVCONTAINER_WORKSPACE_MEMORY:-8g}
    memswap_limit: ${DEVCONTAINER_WORKSPACE_MEMORY:-8g}
    cpus: ${DEVCONTAINER_WORKSPACE_CPUS:-8}
    logging: *logging
    command: ["sh", ".devcontainer/start-workspace.sh"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/workspace-ready"]
      interval: 30s
      retries: 3
      start_period: 600s
      start_interval: 2s
    ports:
      - "127.0.0.1:${DEVCONTAINER_CLIENT_PORT:-3000}:3000"
      - "127.0.0.1:${DEVCONTAINER_API_PORT:-3001}:3001"
    # Service hostnames replace the localhost values in apps/*/.env; process values win over .env files.
    environment:
      DEVCONTAINER: "true"
      PLAYWRIGHT_BROWSERS_PATH: /home/dev/.playwright-browsers
      TURBO_CACHE_DIR: /workspace/.turbo/cache
      DB_HOST: postgres
      DB_PORT: "5432"
      CLIENT_URL: http://localhost:${DEVCONTAINER_CLIENT_PORT:-3000}
      SERVER_URL: http://localhost:3001
    volumes:
      - ..:/workspace
      - bun-cache:/home/dev/.bun-cache
      - playwright-browsers:/home/dev/.playwright-browsers
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-example-admin-password}
      POSTGRES_DB: ${DB_NAME:-postgres}
      # The init scripts set these role passwords on the volume's first start.
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:-example-migrator-password}
      DB_PASSWORD: ${DB_PASSWORD:-example-runtime-password}
      DB_CLI_PASSWORD: ${DB_CLI_PASSWORD:-example-cli-password}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../apps/server/src/db/provision/initdb:/docker-entrypoint-initdb.d:ro
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

volumes:
  postgres-data:
  bun-cache:
    external: true
    name: app-bun-cache
  playwright-browsers:
    external: true
    name: app-playwright-browsers
