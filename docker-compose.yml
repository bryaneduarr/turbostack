x-production-environment: &production-environment
  NODE_ENV: production
  DB_HOST: postgres
  DB_PORT: 5432
  DB_SSL_MODE: disable

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:?DB_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      # The init scripts set these role passwords on the volume's first start.
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_CLI_PASSWORD: ${DB_CLI_PASSWORD:?DB_CLI_PASSWORD is required}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./apps/server/src/db/provision/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-server-migrations:
    profiles: [production]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: api-server:local
    command: ["bun", "db/migrate/apply-migrations.script.js"]
    env_file: apps/server/.env
    environment: *production-environment
    depends_on:
      postgres:
        condition: service_healthy

  api-server:
    profiles: [production]
    image: api-server:local
    env_file: apps/server/.env
    environment:
      <<: *production-environment
      PORT: 3001
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      api-server-migrations:
        condition: service_completed_successfully

  web-client:
    profiles: [production]
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    image: web-client:local
    env_file: apps/client/.env
    environment:
      SERVER_URL: http://api-server:3001
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      api-server:
        condition: service_healthy

volumes:
  postgres-data:
