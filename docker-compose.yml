# Local development database:
#   bun run db:up
# Production-like stack (Postgres, migrations, and the bundled server image):
#   docker compose --profile production up --build

x-server-environment: &server-environment
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-example-local-password}
  DB_NAME: ${POSTGRES_DB:-postgres}
  DB_SSL_MODE: disable

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: [production]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: server:local
    command: ["bun", "db/migrate/apply-migrations.script.js"]
    environment: *server-environment
    depends_on:
      postgres:
        condition: service_healthy

  server:
    profiles: [production]
    image: server:local
    environment:
      <<: *server-environment
      PORT: 3001
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
