name: Release images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  affected:
    name: Find affected deployable apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - id: apps
        env:
          TURBO_SCM_BASE: ${{ github.event.before }}
          AFFECTED_FLAG: ${{ github.event_name == 'push' && '--affected' || '' }}
        run: |
          bunx turbo ls $AFFECTED_FLAG --output=json > packages.json
          deployable='[]'
          for row in $(jq -c '.packages.items[] | select(.path | startswith("apps/"))' packages.json); do
            if [ -f "$(echo "$row" | jq -r '.path')/Dockerfile" ]; then
              deployable=$(echo "$deployable" | jq -c --argjson row "$row" '. + [$row]')
            fi
          done
          echo "Deployable affected apps: $deployable"
          echo "apps=$deployable" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.app.name }} image
    needs: affected
    if: needs.affected.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.affected.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app.path }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}
